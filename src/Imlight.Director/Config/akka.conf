akka {
  loglevel = "DEBUG"
  loggers = ["Akka.Logger.Serilog.SerilogLogger, Akka.Logger.Serilog"]

  actor {
      provider = remote

      mailbox {
        requirements {
          "akka.dispatch.unbounded-priority-mailbox" = zone-priority
        }
        zone-priority {
          mailbox-type = "Imlight.CoreLib.Shared.Networking.ZonePriorityMailbox, Imlight.CoreLib"
        }
      }
  }

  remote {
    dot-netty.tcp {
      hostname = "127.0.0.1"
      port = 12999
    }
  }
}
