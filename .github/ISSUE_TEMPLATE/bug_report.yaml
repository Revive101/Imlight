name: Bug report
description: Report a bug which occured using Imlight
labels: ['Class: bug']

body:
  - type: textarea
    id: description
    attributes:
      label: Description of the problem
      description: Precise description of the problem.
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Description of the steps which are necessary to reproduce this bug
      placeholder: A clear and concise list of steps on how to reproduce the problem or code to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Describe the expected behaviour
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: 'Any other additional context you''d like to add'
      placeholder: Add any other context or screenshots about the problem here.
